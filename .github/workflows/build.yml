name: Build CLI Executable

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# softprops/action-gh-release@v2 must be able to create the release and upload
# assets on the tag ref. GITHUB_TOKEN defaults to read-only in restricted
# repos, so grant explicit write access to repository contents.
permissions:
  contents: write

jobs:
  # -------------------------------------------------------------------------
  # CLI build: terminal TUI for Windows + Linux. Aggressively excludes every
  # GUI framework (pywebview, Qt, customtkinter) so no GUI pixels ship.
  # -------------------------------------------------------------------------
  build-cli:
    name: build-cli (${{ matrix.os-short }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-short: windows
          - os: ubuntu-latest
            os-short: linux

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y mpv python3-pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pyinstaller

      - name: Build CLI executable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python build_cli.py `
            --exclude-module PyQt6 `
            --exclude-module PySide6 `
            --exclude-module customtkinter `
            --exclude-module webview `
            --exclude-module tkinter `
            --exclude-module unittest `
            --exclude-module pydoc `
            --exe-name ani-cli-ar-cli-windows `
            --zip

      - name: Build CLI executable (Linux)
        if: runner.os == 'Linux'
        run: |
          python build_cli.py \
            --exclude-module PyQt6 \
            --exclude-module PySide6 \
            --exclude-module customtkinter \
            --exclude-module webview \
            --exclude-module tkinter \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exe-name ani-cli-ar-cli

      - name: Assemble Linux CLI bundle
        if: runner.os == 'Linux'
        run: |
          mkdir -p ani-cli-ar-cli
          cp dist/ani-cli-ar-cli ani-cli-ar-cli/ani-cli-ar-cli
          cp scripts/install_cli.sh ani-cli-ar-cli/install.sh
          chmod +x ani-cli-ar-cli/install.sh ani-cli-ar-cli/ani-cli-ar-cli
          tar -czf ani-cli-ar-cli-linux.tar.gz ani-cli-ar-cli
          echo "Bundled:"
          ls -lh ani-cli-ar-cli/ ani-cli-ar-cli-linux.tar.gz

      - name: Upload CLI artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ani-cli-ar-cli-windows
          path: |
            dist/ani-cli-ar-cli-windows.exe
            dist/ani-cli-ar-cli-windows.zip

      - name: Upload CLI artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ani-cli-ar-cli-linux
          path: ani-cli-ar-cli-linux.tar.gz

  release:
    needs: [build-cli]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List release assets
        run: ls -lh artifacts/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: false
