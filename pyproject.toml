[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-cli-ar"
dynamic = ["version"]
description = "Terminal-based anime streaming with Arabic subtitles"
readme = "README.md"
license = "GPL-3.0"
authors = [
    {name = "NoBy"}
]
maintainers = [
    {name = "NoBy"}
]
keywords = ["anime", "streaming", "cli", "arabic", "subtitles", "terminal"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Environment :: Console",
]
requires-python = ">=3.8"
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "httpx>=0.28.0",
    "pypresence>=4.5.0",
    "yt-dlp",
    "Pillow>=10.0.0",
    "numpy>=1.24.0",
    "pycryptodomex",
    "playwright>=1.40.0",
]

[project.urls]
Homepage = "https://github.com/np4abdou1/ani-cli-arabic"
Repository = "https://github.com/np4abdou1/ani-cli-arabic"
Issues = "https://github.com/np4abdou1/ani-cli-arabic/issues"
Changelog = "https://github.com/np4abdou1/ani-cli-arabic/releases"

[project.scripts]
ani-cli-arabic = "ani_cli_arabic.app:main"
ani-cli-ar = "ani_cli_arabic.app:main"

[tool.setuptools]
packages = {find = {include = ["ani_cli_arabic*"]}}
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "ani_cli_arabic.version.__version__"}
